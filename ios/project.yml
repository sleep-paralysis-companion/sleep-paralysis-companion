name: SleepParalysisCompanion

options:
  createIntermediateGroups: true
  developmentLanguage: en
  generateEmptyDirectories: true
  groupSortPosition: top
  minimumXcodeGenVersion: "2.45.4"
  xcodeVersion: "26.6"

configs:
  Development: debug
  Staging: release
  Production: release

configFiles:
  Development: Configurations/Development.xcconfig
  Staging: Configurations/Staging.xcconfig
  Production: Configurations/Production.xcconfig

settings:
  base:
    APPLICATION_EXTENSION_API_ONLY: NO
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    CLANG_WARN_BLOCK_CAPTURE_AUTORELEASING: YES
    CLANG_WARN_BOOL_CONVERSION: YES
    CLANG_WARN_COMMA: YES
    CLANG_WARN_CONSTANT_CONVERSION: YES
    CLANG_WARN_DEPRECATED_OBJC_IMPLEMENTATIONS: YES
    CLANG_WARN_DIRECT_OBJC_ISA_USAGE: YES_ERROR
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    CLANG_WARN_EMPTY_BODY: YES
    CLANG_WARN_ENUM_CONVERSION: YES
    CLANG_WARN_INFINITE_RECURSION: YES
    CLANG_WARN_INT_CONVERSION: YES
    CLANG_WARN_NON_LITERAL_NULL_CONVERSION: YES
    CLANG_WARN_OBJC_IMPLICIT_RETAIN_SELF: YES
    CLANG_WARN_OBJC_LITERAL_CONVERSION: YES
    CLANG_WARN_OBJC_ROOT_CLASS: YES_ERROR
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
    CLANG_WARN_RANGE_LOOP_ANALYSIS: YES
    CLANG_WARN_STRICT_PROTOTYPES: YES
    CLANG_WARN_SUSPICIOUS_MOVE: YES
    CLANG_WARN_UNGUARDED_AVAILABILITY: YES_AGGRESSIVE
    CLANG_WARN_UNREACHABLE_CODE: YES
    CLANG_WARN__DUPLICATE_METHOD_MATCH: YES
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    COPY_PHASE_STRIP: NO
    CURRENT_PROJECT_VERSION: 1
    DEAD_CODE_STRIPPING: YES
    ENABLE_STRICT_OBJC_MSGSEND: YES
    ENABLE_TESTABILITY: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    GCC_NO_COMMON_BLOCKS: YES
    GCC_WARN_64_TO_32_BIT_CONVERSION: YES
    GCC_WARN_ABOUT_RETURN_TYPE: YES_ERROR
    GCC_WARN_UNDECLARED_SELECTOR: YES
    GCC_WARN_UNINITIALIZED_AUTOS: YES_AGGRESSIVE
    GCC_WARN_UNUSED_FUNCTION: YES
    GCC_WARN_UNUSED_VARIABLE: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    MARKETING_VERSION: 0.1.0
    ONLY_ACTIVE_ARCH: YES
    SDKROOT: iphoneos
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SWIFT_EMIT_LOC_STRINGS: YES
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    VERSIONING_SYSTEM: apple-generic

targets:
  SleepParalysisCompanion:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
        excludes:
          - Info.plist
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: "$(SPC_BUNDLE_IDENTIFIER)"
        PRODUCT_MODULE_NAME: SleepParalysisCompanion
        PRODUCT_NAME: SleepParalysisCompanion
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    preBuildScripts: []

  SPCUnitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/Unit
    dependencies:
      - target: SleepParalysisCompanion
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: "$(SPC_BUNDLE_IDENTIFIER).unittests"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SleepParalysisCompanion.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/SleepParalysisCompanion"
        BUNDLE_LOADER: "$(TEST_HOST)"

  SPCUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UI
    dependencies:
      - target: SleepParalysisCompanion
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: "$(SPC_BUNDLE_IDENTIFIER).uitests"
        TEST_TARGET_NAME: SleepParalysisCompanion

schemes:
  SPC-Development:
    build:
      targets:
        SleepParalysisCompanion: all
        SPCUnitTests: [test]
        SPCUITests: [test]
    run:
      config: Development
      commandLineArguments:
        "-SPCEnvironment development": true
    test:
      config: Development
      gatherCoverageData: true
      targets:
        - name: SPCUnitTests
          parallelizable: false
          randomExecutionOrder: false
        - name: SPCUITests
          parallelizable: false
          randomExecutionOrder: false
    archive:
      config: Development

  SPC-Staging:
    build:
      targets:
        SleepParalysisCompanion: all
        SPCUnitTests: [test]
        SPCUITests: [test]
    run:
      config: Staging
      commandLineArguments:
        "-SPCEnvironment staging": true
    test:
      config: Staging
      gatherCoverageData: true
      targets:
        - SPCUnitTests
        - SPCUITests
    archive:
      config: Staging

  SPC-Production:
    build:
      targets:
        SleepParalysisCompanion: all
        SPCUnitTests: [test]
        SPCUITests: [test]
    run:
      config: Production
      commandLineArguments:
        "-SPCEnvironment production": true
    test:
      config: Production
      gatherCoverageData: true
      targets:
        - SPCUnitTests
        - SPCUITests
    archive:
      config: Production
