name: Sleep Paralysis Companion TestFlight

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: What should testers focus on in this build?
        required: false
        default: Physical iPhone validation
        type: string
  pull_request:
    paths:
      - ".github/workflows/testflight-internal.yml"
      - "ios/Configurations/**"
      - "ios/ExportOptions-TestFlight.plist"
      - "ios/project.yml"
      - "ios/Resources/Info.plist"
      - "ios/Resources/PrivacyInfo.xcprivacy"
      - "ios/Resources/Assets.xcassets/AppIcon.appiconset/**"
      - "ios/Resources/*.entitlements"
      - "ios/Widget/*.entitlements"
      - "ios/Widget/Info.plist"
      - "scripts/testflight_configuration_check.sh"

permissions:
  contents: read

concurrency:
  group: sleep-paralysis-companion-testflight
  cancel-in-progress: false

jobs:
  validate-repository-configuration:
    name: Validate TestFlight repository configuration
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Check out the release candidate
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate the repository-only release contract
        run: bash scripts/testflight_configuration_check.sh

  archive-and-upload:
    name: Archive and upload internal TestFlight build
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: validate-repository-configuration
    runs-on: macos-26
    timeout-minutes: 75
    env:
      APP_BUNDLE_ID: app.sleepcompanion.spc
      WIDGET_BUNDLE_ID: app.sleepcompanion.spc.widget
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
      APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
      SPC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SPC_SUPABASE_PUBLISHABLE_KEY }}
      SPC_OAUTH_REDIRECT_URL: ${{ vars.SPC_OAUTH_REDIRECT_URL }}
    steps:
      - name: Check out the release candidate
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate required release configuration
        env:
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPSTORE_CERTIFICATES_FILE_BASE64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          APPSTORE_CERTIFICATES_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$APPLE_TEAM_ID" || { echo "Missing repository variable APPLE_TEAM_ID" >&2; exit 1; }
          test -n "$APPSTORE_ISSUER_ID" || { echo "Missing repository variable APPSTORE_ISSUER_ID" >&2; exit 1; }
          test -n "$APPSTORE_API_KEY_ID" || { echo "Missing repository variable APPSTORE_API_KEY_ID" >&2; exit 1; }
          test -n "$APPSTORE_API_PRIVATE_KEY" || { echo "Missing repository secret APPSTORE_API_PRIVATE_KEY" >&2; exit 1; }
          test -n "$APPSTORE_CERTIFICATES_FILE_BASE64" || { echo "Missing repository secret APPSTORE_CERTIFICATES_FILE_BASE64" >&2; exit 1; }
          test -n "$APPSTORE_CERTIFICATES_PASSWORD" || { echo "Missing repository secret APPSTORE_CERTIFICATES_PASSWORD" >&2; exit 1; }
          test -n "$SPC_SUPABASE_PUBLISHABLE_KEY" || { echo "Missing repository secret SPC_SUPABASE_PUBLISHABLE_KEY" >&2; exit 1; }
          test -n "$SPC_OAUTH_REDIRECT_URL" || { echo "Missing repository variable SPC_OAUTH_REDIRECT_URL" >&2; exit 1; }
          [[ "$SPC_SUPABASE_PUBLISHABLE_KEY" =~ ^sb_publishable_[A-Za-z0-9_-]{20,}$ ]] || {
            echo "SPC_SUPABASE_PUBLISHABLE_KEY is not a valid publishable-key value" >&2
            exit 1
          }
          [[ "$SPC_OAUTH_REDIRECT_URL" == "spc://auth/callback" ]] || {
            echo "SPC_OAUTH_REDIRECT_URL must exactly match the approved production redirect" >&2
            exit 1
          }

      - name: Restore pinned build tools and Swift packages
        uses: actions/cache@v5
        with:
          path: |
            .build-tools
            ios/.generated/SourcePackages
          key: testflight-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/versions.env', 'ios/project.yml', 'ios/Package.resolved') }}

      - name: Select and verify the pinned Xcode toolchain
        run: bash scripts/select_xcode.sh

      - name: Configure authorized public runtime values
        run: |
          bash scripts/provision_local_xcconfig.sh
          bash scripts/auth_config_preflight.sh --configuration Production

      - name: Generate the Xcode project and resolve packages
        run: bash scripts/bootstrap.sh

      - name: Import the Apple distribution certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

      - name: Download the app App Store profile
        uses: apple-actions/download-provisioning-profiles@v6
        with:
          bundle-id: ${{ env.APP_BUNDLE_ID }}
          profile-type: IOS_APP_STORE
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Download the widget App Store profile
        uses: apple-actions/download-provisioning-profiles@v6
        with:
          bundle-id: ${{ env.WIDGET_BUNDLE_ID }}
          profile-type: IOS_APP_STORE
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Validate installed provisioning profiles
        run: |
          set -euo pipefail
          validate_profile() {
            local bundle_id="$1"
            local expected_name="$2"
            local expected_app_group="$3"
            local matched=false
            local decoded_profile
            decoded_profile="$(mktemp "$RUNNER_TEMP/profile.XXXXXX")"

            while IFS= read -r -d '' profile; do
              security cms -D -i "$profile" > "$decoded_profile"
              if [[ "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$decoded_profile")" \
                != "$APPLE_TEAM_ID.$bundle_id" ]]; then
                continue
              fi

              if [[ "$(/usr/libexec/PlistBuddy -c 'Print :Name' "$decoded_profile")" != "$expected_name" ]]; then
                continue
              fi
              /usr/libexec/PlistBuddy \
                -c 'Print :Entitlements:com.apple.security.application-groups' \
                "$decoded_profile" | grep -Fq "$expected_app_group" || {
                  echo "The installed $bundle_id profile is missing the required app group" >&2
                  exit 1
                }
              matched=true
            done < <(find "$HOME/Library/MobileDevice/Provisioning Profiles" -type f -name '*.mobileprovision' -print0)

            [[ "$matched" == true ]] || {
              echo "No installed provisioning profile matches $bundle_id and APPLE_TEAM_ID" >&2
              exit 1
            }
          }

          validate_profile "$APP_BUNDLE_ID" "Sleep Paralysis Companion - App Store" "group.$APP_BUNDLE_ID"
          validate_profile "$WIDGET_BUNDLE_ID" "Sleep Paralysis Companion Widget - App Store" "group.$APP_BUNDLE_ID"

      - name: Archive and export the production IPA
        id: archive
        uses: Apple-Actions/xcodebuild@v1
        with:
          project: ios/SleepParalysisCompanion.xcodeproj
          scheme: SPC-Production
          configuration: Production
          sdk: iphoneos
          destination: generic/platform=iOS
          action: archive
          archive-path: .build/Archives/SleepParalysisCompanion.xcarchive
          export-options-plist: ios/ExportOptions-TestFlight.plist
          export-path: .build/Export
          build-number: ${{ github.run_number }}
          build-settings: |
            APPLE_TEAM_ID=${{ vars.APPLE_TEAM_ID }}
            DEVELOPMENT_TEAM=${{ vars.APPLE_TEAM_ID }}
            CURRENT_PROJECT_VERSION=${{ github.run_number }}
            CODE_SIGNING_ALLOWED=YES
            CODE_SIGNING_REQUIRED=YES
            CODE_SIGN_STYLE=Manual

      - name: Upload the IPA to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ steps.archive.outputs.ipa-path }}
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          release-notes: ${{ inputs.release_notes }}
          uses-non-exempt-encryption: 'false'
          wait-for-processing: 'false'

      - name: Wait for Apple build processing
        env:
          APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APP_BUNDLE_ID: ${{ env.APP_BUNDLE_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: node scripts/poll_build_processing.mjs

      - name: Retain archive and build metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sleep-paralysis-companion-testflight-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            .build/Archives
            .build/Export
            .build/*.log
