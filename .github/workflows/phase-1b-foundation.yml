name: Phase 1B Data Auth Security Offline Foundation

on:
  push:
    branches:
      - codex/phase-1b-data-auth
  pull_request:
    paths:
      - ".github/workflows/phase-1b-foundation.yml"
      - ".swiftformat"
      - ".swiftlint.yml"
      - "ios/**"
      - "scripts/**"
      - "supabase/**"

permissions:
  contents: read

concurrency:
  group: phase-1b-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Xcode 26.6 / iPhone 17 / iOS 26.5
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Record runner and toolchain
        run: |
          sw_vers
          uname -m
          env | grep '^Image' | sort || true

      - name: Restore pinned build tools and Swift packages
        uses: actions/cache@v5
        with:
          path: |
            .build-tools
            ios/.generated/SourcePackages
          key: phase-1b-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/versions.env', 'ios/project.yml', 'ios/Package.resolved') }}

      - name: Verify iOS foundation
        run: bash scripts/verify_ci.sh

      - name: Retain test results, lock state, and generated project
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-1b-ios-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            scripts/versions.env
            ios/TestResults/*.xcresult
            ios/SleepParalysisCompanion.xcodeproj/project.pbxproj
            ios/SleepParalysisCompanion.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
            ios/SleepParalysisCompanion.xcodeproj/xcshareddata/xcschemes/*.xcscheme

  isolated-backend:
    name: Supabase 2.110.0 / Postgres 17 / pgTAP
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Deno 2.8.1
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.8.1

      - name: Record backend toolchain
        run: |
          docker version
          node --version
          deno --version

      - name: Restore CLI and Deno caches
        uses: actions/cache@v5
        with:
          path: |
            ~/.npm
            ~/.cache/deno
          key: phase-1b-backend-${{ runner.os }}-${{ hashFiles('scripts/versions.env', 'supabase/config.toml', 'supabase/functions/**/deno.json') }}

      - name: Verify isolated backend
        run: bash scripts/verify_backend_ci.sh

      - name: Retain migration and policy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-1b-backend-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          path: |
            scripts/versions.env
            supabase/config.toml
            supabase/migrations
            supabase/tests
            supabase/functions/delete-account
